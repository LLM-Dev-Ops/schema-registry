# ============================================================================
# Environment Variables for LLM Schema Registry Cloud Run Deployment
# ============================================================================
#
# This file defines the required environment variables for deployment.
# Values marked with ${SECRET} should be stored in Google Secret Manager.
#
# Usage:
#   - Copy this file to env.dev.yaml, env.staging.yaml, env.prod.yaml
#   - Replace placeholder values with actual values
#   - Use gcloud run services update to apply environment variables
#
# ============================================================================

# Service Identification
SERVICE_NAME: llm-schema-registry
SERVICE_VERSION: "1.0.0"
PLATFORM_ENV: dev  # dev | staging | prod

# RuVector Service Integration (Persistence Layer)
# CRITICAL: All persistence MUST go through ruvector-service
# LLM-Schema-Registry does NOT connect directly to Google SQL
RUVECTOR_SERVICE_URL: "${RUVECTOR_SERVICE_URL}"  # e.g., https://ruvector-service-xxxxx.run.app
RUVECTOR_API_KEY: "${SECRET:ruvector-api-key}"   # Stored in Secret Manager

# Telemetry Configuration (LLM-Observatory)
TELEMETRY_ENDPOINT: "https://llm-observatory.agentics.dev/v1/traces"
OTLP_ENDPOINT: "https://llm-observatory.agentics.dev/v1/traces"
TRACE_SAMPLING_RATE: "0.1"

# Logging Configuration
RUST_LOG: "info"
RUST_BACKTRACE: "1"
JSON_LOGS: "true"

# Validation Engine Configuration
MAX_SCHEMA_SIZE: "1048576"        # 1MB max schema size
VALIDATION_TIMEOUT_MS: "5000"      # 5 second validation timeout
STRICT_MODE: "false"               # Enable strict validation mode
ENABLE_SEMANTIC_CHECKS: "true"     # Enable semantic validation
ENABLE_PERFORMANCE_CHECKS: "true"  # Enable performance checks
ENABLE_SECURITY_CHECKS: "true"     # Enable security checks
MAX_NESTING_DEPTH: "50"            # Maximum nesting depth for schemas
MAX_PROPERTIES: "500"              # Maximum properties in a schema

# ============================================================================
# Secret Manager Keys (do NOT put actual values here)
# ============================================================================
#
# The following secrets should be stored in Google Secret Manager:
#
# - ruvector-api-key: API key for ruvector-service authentication
#
# To create secrets:
#   gcloud secrets create ruvector-api-key --data-file=./ruvector-api-key.txt
#
# To grant Cloud Run access:
#   gcloud secrets add-iam-policy-binding ruvector-api-key \
#     --member="serviceAccount:llm-schema-registry-sa@PROJECT_ID.iam.gserviceaccount.com" \
#     --role="roles/secretmanager.secretAccessor"
#
# ============================================================================
