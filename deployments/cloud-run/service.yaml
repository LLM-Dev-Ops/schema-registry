# ============================================================================
# Cloud Run Service Configuration for LLM Schema Registry
# Unified service exposing all schema agent endpoints
# ============================================================================
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: llm-schema-registry
  labels:
    app: llm-schema-registry
    team: agentics
    component: schema-governance
  annotations:
    run.googleapis.com/description: "LLM Schema Registry - Authoritative schema definition and contract governance layer"
    run.googleapis.com/ingress: all
    run.googleapis.com/launch-stage: GA
spec:
  template:
    metadata:
      annotations:
        # Scaling configuration
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      serviceAccountName: llm-schema-registry-sa
      containers:
        - name: schema-registry
          image: us-central1-docker.pkg.dev/PROJECT_ID/llm-schema-registry/schema-registry:latest
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "2"
              memory: 1Gi
          env:
            # Service identification
            - name: SERVICE_NAME
              value: "llm-schema-registry"
            - name: SERVICE_VERSION
              value: "1.0.0"
            - name: PLATFORM_ENV
              value: "dev"

            # RuVector service integration (persistence layer)
            - name: RUVECTOR_SERVICE_URL
              valueFrom:
                secretKeyRef:
                  name: RUVECTOR_SERVICE_URL
                  key: latest
            - name: RUVECTOR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: RUVECTOR_API_KEY
                  key: latest

            # Telemetry configuration
            - name: TELEMETRY_ENDPOINT
              value: "https://llm-observatory.agentics.dev/v1/traces"
            - name: OTLP_ENDPOINT
              value: "https://llm-observatory.agentics.dev/v1/traces"
            - name: TRACE_SAMPLING_RATE
              value: "0.1"

            # Logging configuration
            - name: RUST_LOG
              value: "info"
            - name: RUST_BACKTRACE
              value: "1"
            - name: JSON_LOGS
              value: "true"

            # Validation configuration
            - name: MAX_SCHEMA_SIZE
              value: "1048576"
            - name: VALIDATION_TIMEOUT_MS
              value: "5000"
            - name: STRICT_MODE
              value: "false"
            - name: ENABLE_SEMANTIC_CHECKS
              value: "true"
            - name: ENABLE_PERFORMANCE_CHECKS
              value: "true"
            - name: ENABLE_SECURITY_CHECKS
              value: "true"

            # Phase 6 Infrastructure Performance Budgets
            - name: MAX_TOKENS
              value: "800"
            - name: MAX_LATENCY_MS
              value: "1500"
            - name: INFRASTRUCTURE_SIGNAL_ENABLED
              value: "true"

          # Health checks
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3

  traffic:
    - percent: 100
      latestRevision: true
